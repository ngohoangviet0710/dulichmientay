<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        if (slug) {
            fetch(`/chi-tiet-tour/${slug}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error("Tour not found");
                    }
                    window.location.replace(`/chi-tiet-tour/${slug}`)
                })
                .catch(() => {
                    window.location.replace("/chi-tiet-tour/not-found.html");
                });
        }

    </script>

</body>

</html>
